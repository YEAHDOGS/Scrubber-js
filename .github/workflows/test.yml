name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Rust tests (the attack, before and after scrubbing)
        run: npm run test:core
        env:
          RUSTFLAGS: -D warnings
      - name: JavaScript tests against the committed module
        run: npm test
      - name: Rebuild the module and test it again
        run: |
          npm run build
          npm test
